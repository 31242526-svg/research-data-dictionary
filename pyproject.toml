[project]
name = "research-data-dictionary"
version = "0.1.0"
description = "Turn a CSV or Excel file into a data dictionary: column types, missingness, ranges and example values."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Shreya Kumari" }]
dependencies = ["pandas>=2.2"]

[project.optional-dependencies]
excel = ["openpyxl>=3.1"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8.0", "ruff>=0.6", "openpyxl>=3.1", "pyarrow>=15"]

[project.scripts]
ddict = "ddict.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddict"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
